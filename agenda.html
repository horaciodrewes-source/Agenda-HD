<title>Agenda de Horacio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: una columna para el celular, encabezado fijo, pestañas grandes, formulario arriba de cada lista. Mismo estilo que la Tarjeta de Golf. */
/* Tono blanco por defecto (se lee mejor). El botón del encabezado pasa a fondo negro, que en pantallas OLED gasta menos batería. */
:root{
  --bg:#ffffff; --surface:#f3f6f4; --ink:#121714; --muted:#4f5c54; --line:#cfd8d2;
  --accent:#1f7a47; --accent-ink:#ffffff; --accent-soft:#dff0e6; --flag:#b8860b;
  --ok:#1f7a47; --danger:#b3352b; --danger-soft:#fbe9e7;
  --t-reunion:#2a5bb8; --t-medico:#b3352b; --t-cumple:#a8186f; --t-trabajo:#8a6100; --t-viaje:#00796b; --t-social:#6b3fb0; --t-discusion:#c2410c; --t-otro:#5d6a62;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",-apple-system,system-ui,sans-serif;
  --r:10px;
  color-scheme:light;
}
:root[data-tono="oscuro"]{
  --bg:#000000; --surface:#0c0e0d; --ink:#eef3ef; --muted:#93a399; --line:#262c28;
  --accent:#2f8a57; --accent-ink:#ffffff; --accent-soft:#0e2417; --flag:#e8b923;
  --ok:#2f8a57; --danger:#e0695c; --danger-soft:#2a1412;
  --t-reunion:#6f9be8; --t-medico:#e0695c; --t-cumple:#e57bbf; --t-trabajo:#e8b923; --t-viaje:#3fc1ad; --t-social:#b9a6ec; --t-discusion:#f0883e; --t-otro:#93a399;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-block:0 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.wrap .wrap{margin:0;width:100%}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tono{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:999px;font-size:.9rem;flex:none}
.tono svg{width:18px;height:18px}
.picked{display:flex;gap:6px;flex-wrap:wrap}
.picked button{min-height:36px;padding:4px 10px 4px 12px;border-radius:999px;background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-size:.95rem}
.newp{display:flex;gap:8px}
.newp input{flex:1}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1{font:700 1.75rem/1 var(--display);margin:0;letter-spacing:.02em;text-transform:uppercase}
.today{color:var(--muted);font-size:.95rem}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px}
.tabs a{flex:1;text-align:center;padding:10px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-family:var(--display);font-size:1.25rem;text-transform:uppercase;letter-spacing:.03em}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.tabs .n{font-family:var(--body);font-weight:400;font-size:.85rem;opacity:.85;margin-left:4px}
form.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
h2{font:700 1.35rem/1.1 var(--display);margin:0;text-transform:uppercase;letter-spacing:.02em}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:700;letter-spacing:.02em;min-width:0}
input,textarea,select{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.textbox{position:relative}
.textbox textarea{padding-right:58px}
.mic{position:absolute;right:8px;top:8px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);cursor:pointer;display:grid;place-items:center}
.mic svg{width:20px;height:20px}
.mic.on{background:var(--danger);color:var(--bg);border-color:var(--danger);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--danger) 25%,transparent)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.hint.warn{color:var(--danger)}
.hint:empty{display:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border-radius:10px;min-height:46px;padding:10px 16px;-webkit-tap-highlight-color:transparent;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
button.danger.solid{background:var(--danger);color:var(--bg);border-color:var(--danger)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:8px 10px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-radius:0;padding:8px 12px;font-weight:400;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.toolbar select{width:auto;padding:8px 10px;background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;font-weight:400;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--t-otro));flex:none}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.item .main{flex:1;min-width:0}
.item .text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.item.done .text{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:4px}
.meta .late{color:var(--danger);font-weight:700}
.meta .soon{color:var(--accent);font-weight:700}
.check{width:28px;height:28px;flex:none;margin-top:1px;accent-color:var(--ok);cursor:pointer}
.item .btns{display:flex;gap:2px;flex:none}
.item .btns button{padding:6px 8px}
.item .btns svg{width:18px;height:18px;display:block}
.group{display:flex;flex-direction:column;gap:8px}
.group h3{font-family:var(--display);font-size:1rem;margin:8px 0 0;color:var(--muted);display:flex;align-items:center;gap:8px}
.group h3 .count{font-family:var(--body);font-weight:400;font-size:.85rem}
.ev{border-left:5px solid var(--c,var(--t-otro))}
.ev .when{flex:none;text-align:center;min-width:52px;font-variant-numeric:tabular-nums}
.ev .when .d{font-family:var(--display);font-size:1.6rem;line-height:1;font-weight:700}
.ev .when .m{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ev.past{opacity:.7}
.tag{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--c)}
.ev a{color:var(--accent)}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.empty{text-align:center;color:var(--muted);padding:28px 16px;border:1px dashed var(--line);border-radius:var(--r)}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-size:1.1rem;margin-bottom:4px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--danger-soft);border-radius:8px;padding:8px 10px}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.cats button{min-height:56px;padding:8px 6px;font-size:.9rem;line-height:1.15;font-weight:600;color:var(--muted);background:var(--bg)}
.cats button[aria-checked="true"]{background:var(--c);border-color:var(--c);color:var(--accent-ink);font-weight:700}
.cats .c-fecha{--c:var(--t-reunion)} .cats .c-urgente{--c:var(--danger)} .cats .c-recordatorio{--c:var(--accent)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px}
.modes button{border:0;border-radius:999px;min-height:46px;background:transparent;color:var(--muted);font:700 1.2rem/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.modes button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
#ev-chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
#ev-chips .chip{justify-content:center;text-align:center;padding:6px 6px;min-height:46px;font-size:.85rem;line-height:1.15}
.menu{display:flex;flex-direction:column;gap:8px}
.menu a{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:var(--r);text-decoration:none;color:var(--ink)}
.menu a:active{background:var(--accent-soft)}
.menu .mt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.menu .mt b{font:700 1.3rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.menu .mt span{font-size:.88rem;color:var(--muted)}
.menu .mt span .late{color:var(--danger);font-weight:700}
.menu .num{font:700 2rem/1 var(--display);color:var(--c);font-variant-numeric:tabular-nums;min-width:1.5ch;text-align:right}
.menu .arrow{color:var(--muted);font-size:1.4rem}
.listhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.listhead h2{flex:1;min-width:0}
a.back{display:inline-flex;align-items:center;min-height:44px;padding:6px 14px 6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;font-weight:700;background:var(--surface)}
.cat-tag{font-weight:700;color:var(--c)}
.topbar{flex-direction:row!important;align-items:center;gap:10px;min-height:52px}
.topbar #nav-left{flex:1;min-width:0;display:flex}
a.go{flex:1;display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 14px;border-radius:12px;background:var(--accent);color:var(--accent-ink);text-decoration:none}
a.go b{font:700 1.3rem/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
a.go .gt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
a.go .badge{font-size:.85rem;font-weight:600;opacity:.95}
a.go .badge:empty{display:none}
a.go .arrow{font-size:1.5rem;line-height:1}
#f-note textarea{min-height:64px}
#note-q{padding:8px 12px;font-size:.95rem}
ul.notes{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.note{border-bottom:1px solid var(--line)}
.note .row{display:flex;align-items:flex-start;gap:4px}
.note .tick{min-height:0;width:36px;height:36px;padding:0;border:0;background:none;display:grid;place-items:center;flex:none;color:var(--muted)}
.note .tick span{width:18px;height:18px;border:2px solid currentColor;border-radius:50%;display:block}
.note.done .tick span{background:var(--ok);border-color:var(--ok)}
.note .ntext{flex:1;min-width:0;min-height:0;text-align:left;border:0;background:none;padding:8px 4px 8px 0;font-weight:400;display:flex;gap:8px;align-items:baseline}
.note .t{flex:1;min-width:0;font-size:.9rem;line-height:1.3;white-space:pre-wrap;overflow-wrap:anywhere}
.note .nd{flex:none;font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.note.done .t{text-decoration:line-through;color:var(--muted)}
.note.pinned .t{font-weight:700}
.note .pin{color:var(--flag);font-size:.75rem;margin-right:4px}
.note .acts{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 10px 40px}
.note .acts button{min-height:38px;padding:6px 10px;font-size:.85rem}
.notes-more{align-self:flex-start}
.status{font-size:.8rem;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20}
@media (max-width:480px){h1{font-size:1.55rem}.item{padding:10px 12px;gap:10px}}
</style>

<div class="wrap">
  <header class="topbar">
    <div id="nav-left"></div>
    <button type="button" class="tono" id="tono"></button>
  </header>

  <!-- ===== NOTAS RÁPIDAS (primera pantalla) ===== -->
  <section id="view-notas" class="wrap" style="padding:0;gap:10px" hidden>
    <form class="card" id="f-note" autocomplete="off">
      <h2 id="f-note-title" hidden>Editar nota</h2>
      <div class="textbox">
        <textarea id="note-text" placeholder="Escribí o dictá una nota rápida" required></textarea>
        <button type="button" class="mic" data-target="note-text" aria-label="Dictar por voz" title="Dictar por voz"></button>
      </div>
      <p class="hint" data-hint-for="note-text"></p>
      <div class="actions">
        <button class="primary" type="submit" id="note-submit">Guardar nota</button>
        <button type="button" class="ghost" id="note-cancel" hidden>Cancelar edición</button>
      </div>
    </form>
    <input type="search" id="note-q" placeholder="Buscar en las notas" aria-label="Buscar en las notas">
    <ul class="notes" id="note-list"></ul>
    <button type="button" class="ghost notes-more" id="notes-done-toggle"></button>
    <div id="done-notes" style="display:flex;flex-direction:column;gap:10px" hidden>
      <h2>Terminadas</h2>
      <ul class="notes" id="note-done-list"></ul>
      <div id="clear-notes-box"></div>
    </div>
  </section>

  <!-- ===== INICIO: nueva tarea + menú de listados ===== -->
  <section id="view-inicio" class="wrap" style="padding:0;gap:14px">
    <div class="modes" role="tablist" aria-label="Qué querés cargar">
      <button type="button" role="tab" data-mode="tarea">Nueva tarea</button>
      <button type="button" role="tab" data-mode="evento">Nuevo evento</button>
    </div>
    <form class="card" id="f-task" autocomplete="off">
      <h2 id="f-task-title" hidden>Editar tarea</h2>
      <div class="textbox">
        <textarea id="task-text" placeholder="Escribí la tarea o tocá el micrófono para dictarla" required></textarea>
        <button type="button" class="mic" data-target="task-text" aria-label="Dictar por voz" title="Dictar por voz"></button>
      </div>
      <p class="hint" data-hint-for="task-text"></p>
      <div class="cats" role="radiogroup" aria-label="Tipo de tarea">
        <button type="button" role="radio" class="c-fecha" data-cat="fecha">Tarea con fecha</button>
        <button type="button" role="radio" class="c-urgente" data-cat="urgente">Urgente sin fecha</button>
      </div>
      <p class="hint warn" id="cat-hint" hidden>Elegí si es una tarea con fecha o urgente.</p>
      <label for="task-date" id="task-date-box" hidden>Fecha<input type="date" id="task-date"></label>
      <div class="actions">
        <button class="primary" type="submit" id="task-submit">Guardar tarea</button>
        <button type="button" class="ghost" id="task-cancel" hidden>Cancelar edición</button>
      </div>
    </form>
    <form class="card" id="f-ev" autocomplete="off" hidden>
      <h2 id="f-ev-title" hidden>Editar evento</h2>
      <div class="textbox">
        <textarea id="ev-text" placeholder="Descripción del evento (podés dictarla)" required></textarea>
        <button type="button" class="mic" data-target="ev-text" aria-label="Dictar por voz" title="Dictar por voz"></button>
      </div>
      <p class="hint" data-hint-for="ev-text"></p>
      <div class="row">
        <label for="ev-date">Fecha<input type="date" id="ev-date" required></label>
        <label for="ev-time">Hora (opcional)<input type="time" id="ev-time"></label>
      </div>
      <div class="row">
        <label for="ev-place">Ubicación<input type="text" id="ev-place" placeholder="Ej.: Av. Olazábal 4261, CABA"></label>
        <label for="ev-type">Tipo de evento<select id="ev-type"></select></label>
      </div>
      <div id="people-box" style="display:flex;flex-direction:column;gap:8px" hidden>
        <label for="ev-person">Personas involucradas
          <select id="ev-person"></select>
        </label>
        <div class="newp" id="newp" hidden>
          <input type="text" id="newp-name" placeholder="Nombre de la persona" aria-label="Nombre de la persona nueva">
          <button type="button" id="newp-add" class="primary">Agregar</button>
        </div>
        <div class="picked" id="ev-people"></div>
      </div>
      <div class="actions">
        <button class="primary" type="submit" id="ev-submit">Guardar evento</button>
        <button type="button" class="ghost" id="ev-cancel" hidden>Cancelar edición</button>
      </div>
    </form>
    <h2>Listados</h2>
    <nav class="menu" id="menu" aria-label="Listados"></nav>
  </section>

  <!-- ===== UN LISTADO DE TAREAS ===== -->
  <section id="view-lista" class="wrap" style="padding:0;gap:14px" hidden>
    <div class="listhead">
      <a href="#inicio" class="back">← Volver</a>
      <h2 id="lista-title"></h2>
    </div>
    <div class="toolbar">
      <label style="flex-direction:row;align-items:center;gap:8px" for="task-sort">Ordenar
        <select id="task-sort"></select>
      </label>
    </div>
    <ul class="list" id="task-list"></ul>
    <div id="clear-done-box"></div>
  </section>

  <!-- ===== EVENTOS ===== -->
  <section id="view-eventos" class="wrap" style="padding:0;gap:14px" hidden>
    <div class="listhead">
      <a href="#inicio" class="back">← Volver</a>
      <h2>Eventos</h2>
    </div>

    <div class="toolbar">
      <div class="seg" role="group" aria-label="Vista">
        <button type="button" data-eview="time">Línea de tiempo</button>
        <button type="button" data-eview="type">Por tipo</button>
      </div>
      <div class="seg" role="group" aria-label="Período">
        <button type="button" data-eperiod="next">Próximos</button>
        <button type="button" data-eperiod="past">Pasados</button>
        <button type="button" data-eperiod="all">Todos</button>
      </div>
    </div>
    <div class="chips" id="ev-chips" role="group" aria-label="Filtrar por tipo"></div>
    <div id="ev-list" class="group"></div>
  </section>

  <p class="status" id="status"></p>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const TYPES = [
  {id:"reunion", name:"Reunión", c:"--t-reunion"},
  {id:"trabajo", name:"Trabajo / Cliente", c:"--t-trabajo"},
  {id:"medico", name:"Médico / Salud", c:"--t-medico"},
  {id:"cumple", name:"Cumpleaños", c:"--t-cumple"},
  {id:"viaje", name:"Viaje", c:"--t-viaje"},
  {id:"social", name:"Social / Familia", c:"--t-social"},
  {id:"discusion", name:"Discusión", c:"--t-discusion"},
  {id:"otro", name:"Otro", c:"--t-otro"},
];
const typeOf = id => TYPES.find(t=>t.id===id) || TYPES[TYPES.length-1];
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const ICON = {
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>'
};

/* ---------- fechas ---------- */
const pad = n => String(n).padStart(2,"0");
const isoToday = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const parseISO = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const dayDiff = s => Math.round((parseISO(s)-parseISO(isoToday()))/86400000);
const fmtLong = s => parseISO(s).toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const fmtShort = s => parseISO(s).toLocaleDateString("es-AR",{weekday:"short",day:"numeric",month:"short"});
function relLabel(s){
  const d=dayDiff(s);
  if(d===0) return "Hoy"; if(d===1) return "Mañana"; if(d===-1) return "Ayer";
  if(d>1 && d<7) return `En ${d} días`; if(d<0) return `Hace ${-d} días`;
  return "";
}

/* ---------- almacenamiento: base de datos privada de Claude, o el navegador ---------- */
const LS_KEY = "agenda-horacio-v1", LS_DEL = "agenda-horacio-borrados";
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)||"[]"); }catch{ return []; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const setStatus = t => { $("#status").textContent = t; };

/* Siempre se guarda en el teléfono. Si la app está abierta dentro de Claude, además se copia a tu cuenta. */
let items = lsGet(LS_KEY);       // {id, kind:"task"|"event", updatedAt, ...}
let deleted = lsGet(LS_DEL);
let col = null, dirty = new Set(), flushing = false, fTimer = null;
const store = {
  put(it){ it = {...it, updatedAt: Date.now()};
    const i = items.findIndex(x=>x.id===it.id); if(i>=0) items[i]=it; else items.push(it);
    lsSet(LS_KEY, items); dirty.add(it.id); schedule(); render(); },
  remove(id){ items = items.filter(x=>x.id!==id); lsSet(LS_KEY, items);
    if(col && !deleted.includes(id)){ deleted.push(id); lsSet(LS_DEL, deleted); }
    dirty.delete(id); schedule(); render(); }
};
function schedule(){ if(!col) return; clearTimeout(fTimer); fTimer = setTimeout(flush, 600); }
async function flush(){
  if(!col || flushing) return; flushing = true;
  try{
    for(const id of [...deleted]){ await col.doc(id).delete(); deleted = deleted.filter(x=>x!==id); lsSet(LS_DEL, deleted); }
    for(const id of [...dirty]){ dirty.delete(id); const it = items.find(x=>x.id===id);
      if(it){ const {id:_, ...body} = it; await col.doc(id).set(JSON.parse(JSON.stringify(body))); } }
    setStatus("Guardado en el teléfono y en tu cuenta.");
  }catch{ setStatus("Guardado en este teléfono."); }
  flushing = false; if(dirty.size || deleted.length) fTimer = setTimeout(flush, 3000);
}
addEventListener("online", ()=>flush());

async function init(){
  setStatus("Guardado en este teléfono.");
  render();
  for(let i=0; i<30 && !window.claude?.use; i++) await new Promise(r=>setTimeout(r,100));
  if(!window.claude?.use) return;
  try{
    const [d,u] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!d || !u) return;
    const me = await u.id(); if(!me) return;
    col = d.collection("data/users/"+me);
    const snap = await col.get();
    const remote = new Map(snap.docs.map(x=>[x.id, x.data()]));
    let changed = false;
    for(const [id,r] of remote){
      if(!r || deleted.includes(id)) continue;
      const i = items.findIndex(x=>x.id===id);
      if(i<0){ items.push({id, ...r}); changed = true; }
      else if((r.updatedAt||0) > (items[i].updatedAt||0)){ items[i] = {id, ...r}; changed = true; }
    }
    for(const it of items){ const r = remote.get(it.id); if(!r || (it.updatedAt||0) > (r.updatedAt||0)) dirty.add(it.id); }
    if(changed){ lsSet(LS_KEY, items); render(); }
    migrateReminders();
    setStatus("Guardado en el teléfono y en tu cuenta.");
    flush();
  }catch{ setStatus("Guardado en este teléfono."); }
}

/* ---------- estado de la interfaz ---------- */
const ui = (()=>{ let s={}; try{ s=JSON.parse(localStorage.getItem("agenda-ui")||"{}"); }catch{}
  return Object.assign({sorts:{}, eview:"time", eperiod:"next", etypes:[]}, s); })();
const saveUI = () => { try{ localStorage.setItem("agenda-ui", JSON.stringify(ui)); }catch{} };
let formMode="tarea", editTask=null, editEv=null, confirmClear=false, confirmDel=null, taskCat="";

/* ---------- listados y navegación ---------- */
const CATS = {
  fecha:{name:"Tarea con fecha", c:"--t-reunion"},
  urgente:{name:"Urgente", c:"--danger"},
  recordatorio:{name:"Recordatorio", c:"--accent"},
};
const catOf = t => t.cat || (t.date ? "fecha" : (t.prio==1 ? "urgente" : "recordatorio"));
const LISTS = {
  urgentes:{title:"Tareas urgentes", c:"--danger", filter:t=>!t.done && catOf(t)==="urgente", empty:"No hay tareas urgentes"},
  programadas:{title:"Tareas con fecha programada", c:"--t-reunion", filter:t=>!t.done && catOf(t)==="fecha", empty:"No hay tareas con fecha"},
  realizadas:{title:"Tareas realizadas", c:"--t-otro", filter:t=>t.done, empty:"Todavía no marcaste tareas como realizadas"},
};
let view = "inicio";
function route(){
  const h = location.hash.slice(1);
  view = LISTS[h] ? h : (["eventos","inicio"].includes(h) ? h : (h==="tareas" ? "inicio" : "notas"));
  $("#view-notas").hidden = view!=="notas";
  $("#view-inicio").hidden = view!=="inicio";
  $("#view-eventos").hidden = view!=="eventos";
  $("#view-lista").hidden = !LISTS[view];
  confirmDel=null; confirmClear=false;
  if(view!=="inicio" && noteConvert){ resetTaskForm(); resetEvForm(); }
  render(); scrollTo(0,0);
}
addEventListener("hashchange", route);

/* ---------- render ---------- */
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function render(){
  const tasks = items.filter(i=>i.kind==="task");
  const evs = items.filter(i=>i.kind==="event");
  renderTop(tasks); renderNotes(); renderMenu(tasks, evs); renderTasks(tasks); renderEvents(evs); renderPeople(); renderCats(); renderMode();
}

function renderMenu(tasks, evs){
  const n = k => tasks.filter(LISTS[k].filter).length;
  const prog = tasks.filter(LISTS.programadas.filter);
  const hoy = prog.filter(t=>dayDiff(t.date)===0).length, venc = prog.filter(t=>dayDiff(t.date)<0).length;
  const next = evs.filter(e=>dayDiff(e.date)>=0).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
  const rows = [
    ["urgentes", n("urgentes") ? "Para hacer cuanto antes" : "Nada urgente"],
    ["programadas", prog.length ? [hoy?`${hoy} para hoy`:"", venc?`<span class="late">${venc} vencida${venc>1?"s":""}</span>`:"", !hoy&&!venc?`La próxima: ${fmtShort(prog.map(t=>t.date).sort()[0])}`:""].filter(Boolean).join(" · ") : "Ninguna programada"],
    ["eventos", next.length ? `Próximo: ${fmtShort(next[0].date)} · ${esc(next[0].text.slice(0,40))}${next[0].text.length>40?"…":""}` : "Sin eventos próximos", next.length, "--t-discusion", "Eventos"],
    ["realizadas", "Tareas ya hechas"],
  ];
  $("#menu").innerHTML = rows.map(([k,sub,num,c,title])=>{
    const L = LISTS[k]||{};
    return `<a href="#${k}" style="--c:var(${c||L.c})"><span class="mt"><b>${title||L.title}</b><span>${sub}</span></span><span class="num">${num??n(k)}</span><span class="arrow" aria-hidden="true">›</span></a>`;
  }).join("");
}

const SORTS = {
  "date-asc":["Fecha (más próxima primero)", (a,b)=>(a.date||"9999").localeCompare(b.date||"9999")],
  "date-desc":["Fecha (más lejana primero)", (a,b)=>(b.date||"").localeCompare(a.date||"")],
  "new":["Más nuevas primero", (a,b)=>(b.created||0)-(a.created||0)],
  "old":["Más antiguas primero", (a,b)=>(a.created||0)-(b.created||0)],
  "alpha":["Alfabético", (a,b)=>a.text.localeCompare(b.text,"es")],
};
function renderTasks(tasks){
  const L = LISTS[view]; if(!L) return;
  $("#lista-title").textContent = L.title;
  $("#lista-title").style.color = `var(${L.c})`;
  const opts = view==="programadas" ? ["date-asc","date-desc","alpha"] : ["new","old","alpha"];
  const cur = opts.includes(ui.sorts[view]) ? ui.sorts[view] : opts[0];
  $("#task-sort").innerHTML = opts.map(k=>`<option value="${k}" ${k===cur?"selected":""}>${SORTS[k][0]}</option>`).join("");
  const list = tasks.filter(L.filter).sort(SORTS[cur][1]);
  const ul = $("#task-list");
  if(!list.length){
    ul.innerHTML = `<li class="empty"><strong>${L.empty}</strong>${view==="realizadas"?"Cuando tildes una tarea, aparece acá.":"Cargá una tarea desde la pantalla principal."}</li>`;
  } else ul.innerHTML = list.map(t=>{
    const cat = catOf(t);
    const rel = t.date ? relLabel(t.date) : "";
    const late = t.date && !t.done && dayDiff(t.date)<0;
    return `<li class="item ${t.done?"done":""}">
      <input type="checkbox" class="check" data-toggle="${t.id}" ${t.done?"checked":""} aria-label="${t.done?"Marcar como pendiente":"Marcar como realizada"}">
      <div class="main">
        <p class="text">${esc(t.text)}</p>
        <div class="meta">
          ${view==="realizadas"?`<span class="cat-tag" style="--c:var(${CATS[cat].c})">${CATS[cat].name}</span>`:""}
          ${t.date?`<span class="${late?"late":(dayDiff(t.date)<=1&&!t.done?"soon":"")}">${fmtShort(t.date)}${rel?" · "+rel:""}${late?" · vencida":""}</span>`:""}
          ${t.voice?`<span>Dictada</span>`:""}
        </div>
        ${confirmDel===t.id?`<div class="confirm" style="margin-top:8px">¿Borrar esta tarea? <button class="danger solid" data-del-yes="${t.id}">Borrar</button><button class="ghost" data-del-no>No</button></div>`:""}
      </div>
      <div class="btns">
        <button class="ghost" data-edit-task="${t.id}" aria-label="Editar" title="Editar">${ICON.edit}</button>
        <button class="ghost" data-del="${t.id}" aria-label="Borrar" title="Borrar">${ICON.del}</button>
      </div></li>`;
  }).join("");
  const nDone = tasks.filter(t=>t.done).length;
  $("#clear-done-box").innerHTML = view!=="realizadas" || !nDone ? "" : confirmClear
    ? `<div class="confirm">¿Borrar las ${nDone} tareas realizadas? No se puede deshacer. <button class="danger solid" id="clear-yes">Sí, borrar</button><button class="ghost" id="clear-no">Cancelar</button></div>`
    : `<button class="danger" id="clear-done">Borrar las realizadas (${nDone})</button>`;
}

function renderMode(){
  $$("[data-mode]").forEach(b=>b.setAttribute("aria-selected", b.dataset.mode===formMode));
  $("#f-task").hidden = formMode!=="tarea";
  $("#f-ev").hidden = formMode!=="evento";
}
function renderCats(){
  $$("[data-cat]").forEach(b=>b.setAttribute("aria-checked", b.dataset.cat===taskCat));
  if(taskCat) $("#cat-hint").hidden=true;
  $("#task-date-box").hidden = taskCat!=="fecha";
  $("#task-date").required = taskCat==="fecha";
}

function renderEvents(evs){
  $$("[data-eview]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.eview===ui.eview));
  $$("[data-eperiod]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.eperiod===ui.eperiod));
  $("#ev-chips").innerHTML = `<button type="button" class="chip" data-etype="" aria-pressed="${!ui.etypes.length}">Todos los tipos</button>` +
    TYPES.map(t=>{ const n=evs.filter(e=>e.type===t.id).length;
      return `<button type="button" class="chip" data-etype="${t.id}" aria-pressed="${ui.etypes.includes(t.id)}" style="--c:var(${t.c})"><span class="dot"></span>${t.name}${n?` · ${n}`:""}</button>`; }).join("");

  let list = evs.filter(e => !ui.etypes.length || ui.etypes.includes(e.type));
  list = list.filter(e => ui.eperiod==="all" || (ui.eperiod==="next" ? dayDiff(e.date)>=0 : dayDiff(e.date)<0));
  const key = e => e.date+"T"+(e.time||"00:00");
  list.sort((a,b)=> ui.eperiod==="past" ? key(b).localeCompare(key(a)) : key(a).localeCompare(key(b)));
  const box = $("#ev-list");
  if(!list.length){
    box.innerHTML = `<div class="empty"><strong>${evs.length?"No hay eventos con este filtro":"Todavía no hay eventos"}</strong>${evs.length?"Probá con otro tipo o período.":"Cargalos desde la pantalla principal, con “Nuevo evento”."}</div>`;
    return;
  }
  const card = e => { const t=typeOf(e.type); const d=parseISO(e.date); const rel=relLabel(e.date);
    return `<li class="item ev ${dayDiff(e.date)<0?"past":""}" style="--c:var(${t.c})">
      <div class="when"><div class="d">${d.getDate()}</div><div class="m">${d.toLocaleDateString("es-AR",{month:"short"}).replace(".","")}</div></div>
      <div class="main">
        <p class="text">${esc(e.text)}</p>
        <div class="meta">
          <span class="tag"><span class="dot"></span>${t.name}</span>
          <span>${d.toLocaleDateString("es-AR",{weekday:"long"})}${e.time?" · "+e.time+" h":""}${rel?" · <b>"+rel+"</b>":""}</span>
          ${e.people?.length?`<span>Con: ${esc(e.people.join(", "))}</span>`:""}
          ${e.place?`<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.place)}" target="_blank" rel="noopener">${esc(e.place)}</a>`:""}
        </div>
        ${confirmDel===e.id?`<div class="confirm" style="margin-top:8px">¿Borrar este evento? <button class="danger solid" data-del-yes="${e.id}">Borrar</button><button class="ghost" data-del-no>No</button></div>`:""}
      </div>
      <div class="btns">
        <button class="ghost" data-edit-ev="${e.id}" aria-label="Editar" title="Editar">${ICON.edit}</button>
        <button class="ghost" data-del="${e.id}" aria-label="Borrar" title="Borrar">${ICON.del}</button>
      </div></li>`; };

  const groups = new Map();
  if(ui.eview==="type"){
    TYPES.forEach(t=>{ const g=list.filter(e=>e.type===t.id); if(g.length) groups.set(`<span class="dot" style="--c:var(${t.c})"></span>${t.name}`, g); });
  } else {
    list.forEach(e=>{ const k=parseISO(e.date).toLocaleDateString("es-AR",{month:"long",year:"numeric"}).replace(/^./,c=>c.toUpperCase()); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(e); });
  }
  box.innerHTML = [...groups].map(([k,g])=>`<div class="group"><h3>${k} <span class="count">${g.length}</span></h3><ul class="list">${g.map(card).join("")}</ul></div>`).join("");
}

/* ---------- acciones ---------- */
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2200); }
const dictated = new Set();

$("#f-task").addEventListener("submit", e=>{
  e.preventDefault(); stopMic();
  const text=$("#task-text").value.trim(); if(!text) return;
  const base = editTask ? items.find(i=>i.id===editTask) : {id:uid(), kind:"task", done:false, created:Date.now()};
  if(!taskCat){ $("#cat-hint").hidden=false; return; }
  const date = taskCat==="fecha" ? $("#task-date").value : "";
  store.put({...base, text, cat:taskCat, date, voice: base.voice||dictated.has("task-text")});
  if(noteConvert){ store.remove(noteConvert); noteConvert=null; }
  toast(`${editTask?"Actualizada":"Guardada"} en ${{fecha:"Con fecha",urgente:"Urgentes"}[taskCat]}`);
  resetTaskForm();
});
function resetTaskForm(){ editTask=null; $("#f-task").reset(); $("#task-date").value=""; taskCat=""; renderCats(); dictated.delete("task-text"); noteConvert=null;
  $("#f-task-title").hidden=true; $("#task-submit").textContent="Guardar tarea"; $("#task-cancel").hidden=true; }
$("#task-cancel").onclick = resetTaskForm;

$("#f-ev").addEventListener("submit", e=>{
  e.preventDefault(); stopMic();
  const text=$("#ev-text").value.trim(); if(!text) return;
  const base = editEv ? items.find(i=>i.id===editEv) : {id:uid(), kind:"event", created:Date.now()};
  store.put({...base, text, date:$("#ev-date").value, time:$("#ev-time").value||"", place:$("#ev-place").value.trim(), type:$("#ev-type").value, people: $("#ev-type").value==="discusion" ? [...picked] : []});
  if(noteConvert){ store.remove(noteConvert); noteConvert=null; }
  toast(editEv?"Evento actualizado":"Evento guardado"); resetEvForm();
});
function resetEvForm(){ editEv=null; noteConvert=null; $("#f-ev").reset(); $("#ev-date").value=isoToday(); picked=[]; renderPeople();
  $("#f-ev-title").hidden=true; $("#ev-submit").textContent="Guardar evento"; $("#ev-cancel").hidden=true; }
$("#ev-cancel").onclick = resetEvForm;
$("#ev-type").innerHTML = TYPES.map(t=>`<option value="${t.id}">${t.name}</option>`).join("");

/* ---------- personas involucradas (tipo Discusión) ---------- */
let picked = [];
const people = () => items.filter(i=>i.kind==="person").map(p=>p.name).sort((a,b)=>a.localeCompare(b,"es"));
function renderPeople(){
  $("#people-box").hidden = $("#ev-type").value!=="discusion";
  const free = people().filter(n=>!picked.includes(n));
  $("#ev-person").innerHTML = `<option value="">${free.length?"Elegí una persona de la lista…":(people().length?"Ya elegiste a todos":"Todavía no hay nadie en la lista")}</option>` +
    free.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join("") + `<option value="__nueva">+ Agregar persona nueva…</option>`;
  $("#ev-people").innerHTML = picked.map(n=>`<button type="button" data-unperson="${esc(n)}" aria-label="Quitar a ${esc(n)}">${esc(n)} ✕</button>`).join("");
}
$("#ev-type").addEventListener("change", renderPeople);
$("#ev-person").addEventListener("change", e=>{
  const v = e.target.value;
  if(v==="__nueva"){ $("#newp").hidden=false; $("#newp-name").focus(); }
  else if(v){ picked.push(v); }
  renderPeople();
});
function addNewPerson(){
  const n = $("#newp-name").value.trim().replace(/\s+/g," "); if(!n) return;
  if(!people().some(x=>x.toLowerCase()===n.toLowerCase())) store.put({id:uid(), kind:"person", name:n});
  const name = people().find(x=>x.toLowerCase()===n.toLowerCase()) || n;
  if(!picked.includes(name)) picked.push(name);
  $("#newp-name").value=""; $("#newp").hidden=true; renderPeople();
}
$("#newp-add").addEventListener("click", addNewPerson);
$("#newp-name").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); addNewPerson(); } });

/* ---------- notas rápidas ---------- */
let editNote=null, openNote=null, noteConvert=null, showDoneNotes=false, confirmClearNotes=false, noteQ="";
const fmtNoteDate = ts => { const d=new Date(ts||Date.now()), now=new Date();
  if(d.toDateString()===now.toDateString()) return "hoy "+pad(d.getHours())+":"+pad(d.getMinutes());
  return d.toLocaleDateString("es-AR",{day:"numeric",month:"short",...(d.getFullYear()!==now.getFullYear()?{year:"2-digit"}:{})}).replace(".",""); };
function renderTop(tasks){
  const L=$("#nav-left");
  if(view==="notas"){
    const urg=tasks.filter(t=>!t.done&&catOf(t)==="urgente").length;
    const prog=tasks.filter(t=>!t.done&&catOf(t)==="fecha"&&t.date);
    const hoy=prog.filter(t=>dayDiff(t.date)===0).length, venc=prog.filter(t=>dayDiff(t.date)<0).length;
    const evh=items.filter(e=>e.kind==="event"&&dayDiff(e.date)===0).length;
    const badge=[urg&&`${urg} urgente${urg>1?"s":""}`, hoy&&`${hoy} para hoy`, venc&&`${venc} vencida${venc>1?"s":""}`, evh&&`${evh} evento${evh>1?"s":""} hoy`].filter(Boolean).join(" · ");
    L.innerHTML=`<a href="#inicio" class="go"><span class="gt"><b>Tareas y eventos</b><span class="badge">${badge}</span></span><span class="arrow" aria-hidden="true">→</span></a>`;
  } else if(view==="inicio") L.innerHTML=`<a href="#notas" class="back">← Notas</a>`;
  else L.innerHTML="";
}
function noteRow(n){
  const open=openNote===n.id;
  const acts = !open ? "" : n.done
    ? `<div class="acts"><button data-note-undo="${n.id}">Volver a pendientes</button>${confirmDel===n.id?`<button class="danger solid" data-del-yes="${n.id}">Sí, borrar</button><button class="ghost" data-del-no>No</button>`:`<button class="danger" data-del="${n.id}">Borrar</button>`}</div>`
    : `<div class="acts"><button data-note-edit="${n.id}">Editar</button><button data-note-pin="${n.id}">${n.pinned?"Desfijar":"Fijar arriba"}</button><button data-note-task="${n.id}">Pasar a tarea</button><button data-note-ev="${n.id}">Pasar a evento</button></div>`;
  return `<li class="note ${n.done?"done":""} ${n.pinned&&!n.done?"pinned":""}"><div class="row">
    <button class="tick" ${n.done?`data-note-undo="${n.id}" aria-label="Volver a pendientes"`:`data-note-done="${n.id}" aria-label="Tachar nota"`}><span></span></button>
    <button class="ntext" data-note-open="${n.id}" aria-expanded="${open}"><span class="t">${n.pinned&&!n.done?'<span class="pin">★</span>':""}${esc(n.text)}</span><span class="nd">${fmtNoteDate(n.created)}</span></button>
  </div>${acts}</li>`;
}
function renderNotes(){
  const q=noteQ.trim().toLowerCase();
  const all=items.filter(i=>i.kind==="note" && (!q || i.text.toLowerCase().includes(q)));
  const pend=all.filter(n=>!n.done).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0) || (b.created||0)-(a.created||0));
  const done=all.filter(n=>n.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  $("#note-list").innerHTML = pend.length ? pend.map(noteRow).join("") : `<li class="empty" style="margin-top:10px"><strong>${q?"Ninguna nota coincide":"No hay notas pendientes"}</strong>${q?"Probá con otra palabra.":"Escribí o dictá una arriba y tocá “Guardar nota”."}</li>`;
  $("#notes-done-toggle").textContent = showDoneNotes ? "Ocultar terminadas" : `Ver terminadas (${done.length})`;
  $("#notes-done-toggle").hidden = !done.length && !showDoneNotes;
  $("#done-notes").hidden = !showDoneNotes;
  $("#note-done-list").innerHTML = done.length ? done.map(noteRow).join("") : `<li class="empty" style="margin-top:10px"><strong>No hay notas terminadas</strong>Tocá el círculo de una nota para tacharla.</li>`;
  $("#clear-notes-box").innerHTML = !done.length ? "" : confirmClearNotes
    ? `<div class="confirm">¿Borrar las ${done.length} notas terminadas? No se puede deshacer. <button class="danger solid" id="clear-notes-yes">Sí, borrar</button><button class="ghost" id="clear-notes-no">Cancelar</button></div>`
    : `<button class="danger" id="clear-notes">Borrar las terminadas (${done.length})</button>`;
}
$("#f-note").addEventListener("submit", e=>{
  e.preventDefault(); stopMic();
  const text=$("#note-text").value.trim(); if(!text) return;
  const base = editNote ? items.find(i=>i.id===editNote) : {id:uid(), kind:"note", done:false, created:Date.now()};
  store.put({...base, text}); toast(editNote?"Nota actualizada":"Nota guardada"); resetNoteForm();
});
function resetNoteForm(){ editNote=null; $("#f-note").reset(); $("#f-note-title").hidden=true; $("#note-submit").textContent="Guardar nota"; $("#note-cancel").hidden=true; }
$("#note-cancel").onclick = resetNoteForm;
$("#note-q").addEventListener("input", e=>{ noteQ=e.target.value; renderNotes(); });
function noteClick(b,d){
  const n = id => items.find(i=>i.id===id);
  if(d.noteOpen){ openNote = openNote===d.noteOpen ? null : d.noteOpen; confirmDel=null; renderNotes(); }
  else if(d.noteDone){ const x=n(d.noteDone); openNote=null; store.put({...x, done:true, doneAt:Date.now()}); toast("Pasó a Terminadas"); }
  else if(d.noteUndo){ const x=n(d.noteUndo); openNote=null; store.put({...x, done:false}); toast("Volvió a pendientes"); }
  else if(d.notePin){ const x=n(d.notePin); openNote=null; store.put({...x, pinned:!x.pinned}); }
  else if(d.noteEdit){ const x=n(d.noteEdit); editNote=x.id; openNote=null; $("#note-text").value=x.text; $("#f-note-title").hidden=false;
    $("#note-submit").textContent="Guardar cambios"; $("#note-cancel").hidden=false; renderNotes(); scrollTo({top:0,behavior:"smooth"}); $("#note-text").focus(); }
  else if(d.noteTask){ const x=n(d.noteTask); openNote=null; resetTaskForm(); noteConvert=x.id; formMode="tarea"; $("#task-text").value=x.text;
    $("#f-task-title").textContent="Pasar nota a tarea"; $("#f-task-title").hidden=false; $("#task-cancel").hidden=false; location.hash="inicio"; }
  else if(d.noteEv){ const x=n(d.noteEv); openNote=null; resetEvForm(); noteConvert=x.id; formMode="evento"; $("#ev-text").value=x.text;
    $("#f-ev-title").textContent="Pasar nota a evento"; $("#f-ev-title").hidden=false; $("#ev-cancel").hidden=false; location.hash="inicio"; }
  else if(b.id==="notes-done-toggle"){ showDoneNotes=!showDoneNotes; renderNotes(); }
  else if(b.id==="clear-notes"){ confirmClearNotes=true; renderNotes(); }
  else if(b.id==="clear-notes-no"){ confirmClearNotes=false; renderNotes(); }
  else if(b.id==="clear-notes-yes"){ confirmClearNotes=false; const done=items.filter(i=>i.kind==="note"&&i.done); done.forEach(x=>store.remove(x.id)); toast(`${done.length} notas borradas`); }
  else return false;
  return true;
}
/* Los recordatorios (tareas sin fecha) ahora son notas rápidas. */
function migrateReminders(){
  items.filter(t=>t.kind==="task" && catOf(t)==="recordatorio").forEach(t=>{
    const {cat, prio, date, ...rest} = t;
    store.put({...rest, kind:"note", ...(t.done?{doneAt:t.updatedAt||Date.now()}:{})});
  });
}

/* ---------- tono blanco / negro ---------- */
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>';
function applyTono(t){
  const dark = t==="oscuro";
  if(dark) document.documentElement.setAttribute("data-tono","oscuro"); else document.documentElement.removeAttribute("data-tono");
  $("#tono").innerHTML = dark ? SUN+"Blanco" : MOON+"Negro";
  $("#tono").setAttribute("aria-label", dark ? "Cambiar a fondo blanco" : "Cambiar a fondo negro");
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.content = dark ? "#000000" : "#ffffff";
}
$("#tono").addEventListener("click", ()=>{ ui.tono = ui.tono==="oscuro" ? "claro" : "oscuro"; saveUI(); applyTono(ui.tono); });

document.addEventListener("click", e=>{
  const b = e.target.closest("button,input[data-toggle]"); if(!b) return;
  const d = b.dataset;
  if(noteClick(b,d)) return;
  if(d.unperson!==undefined){ picked = picked.filter(n=>n!==d.unperson); renderPeople(); }
  else if(d.mode){ stopMic(); formMode=d.mode; renderMode(); }
  else if(d.cat){ taskCat=d.cat; if(taskCat==="fecha" && !$("#task-date").value) $("#task-date").value=isoToday(); renderCats(); }
  else if(d.eview){ ui.eview=d.eview; saveUI(); render(); }
  else if(d.eperiod){ ui.eperiod=d.eperiod; saveUI(); render(); }
  else if(d.etype!==undefined){ if(!d.etype) ui.etypes=[]; else ui.etypes = ui.etypes.includes(d.etype) ? ui.etypes.filter(x=>x!==d.etype) : [...ui.etypes,d.etype]; saveUI(); render(); }
  else if(d.toggle){ const t=items.find(i=>i.id===d.toggle); if(t){ store.put({...t, done:!t.done}); toast(t.done ? "Volvió a pendientes" : "¡Hecha! Pasó a Realizadas"); } }
  else if(d.del){ confirmDel=d.del; render(); }
  else if(d.delYes){ confirmDel=null; store.remove(d.delYes); toast("Borrado"); }
  else if(d.delNo!==undefined){ confirmDel=null; render(); }
  else if(d.editTask){ const t=items.find(i=>i.id===d.editTask); editTask=t.id;
    if(location.hash!=="#inicio") location.hash="inicio";
    $("#task-text").value=t.text; $("#task-date").value=t.date||""; taskCat=catOf(t); renderCats();
    formMode="tarea"; renderMode(); $("#f-task-title").textContent="Editar tarea"; $("#f-task-title").hidden=false; $("#task-submit").textContent="Guardar cambios"; $("#task-cancel").hidden=false;
    setTimeout(()=>{ $("#f-task").scrollIntoView({behavior:"smooth"}); $("#task-text").focus(); }, 50); }
  else if(d.editEv){ const t=items.find(i=>i.id===d.editEv); editEv=t.id;
    if(location.hash!=="#inicio") location.hash="inicio"; formMode="evento"; renderMode();
    $("#ev-text").value=t.text; $("#ev-date").value=t.date; $("#ev-time").value=t.time||""; $("#ev-place").value=t.place||""; $("#ev-type").value=t.type; picked=[...(t.people||[])]; renderPeople();
    $("#f-ev-title").textContent="Editar evento"; $("#f-ev-title").hidden=false; $("#ev-submit").textContent="Guardar cambios"; $("#ev-cancel").hidden=false;
    setTimeout(()=>{ $("#f-ev").scrollIntoView({behavior:"smooth"}); $("#ev-text").focus(); }, 50); }
  else if(b.id==="clear-done"){ confirmClear=true; render(); }
  else if(b.id==="clear-no"){ confirmClear=false; render(); }
  else if(b.id==="clear-yes"){ confirmClear=false; const done=items.filter(i=>i.kind==="task"&&i.done); done.forEach(t=>store.remove(t.id)); toast(`${done.length} tareas borradas`); }
});
$("#task-sort").addEventListener("change", e=>{ ui.sorts[view]=e.target.value; saveUI(); render(); });

/* ---------- dictado por voz ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, recBtn=null;
const KEYBOARD_TIP = "Para dictar, tocá el micrófono del teclado de tu celular (el teclado convierte la voz en texto).";
$$(".mic").forEach(btn=>{
  btn.innerHTML = ICON.mic;
  btn.addEventListener("click", ()=> recBtn===btn ? stopMic() : startMic(btn));
});
function hint(id, msg, warn){ const h=$(`[data-hint-for="${id}"]`); h.textContent=msg; h.classList.toggle("warn",!!warn); }
function startMic(btn){
  const id = btn.dataset.target, ta = $("#"+id);
  if(!SR){ hint(id, KEYBOARD_TIP); ta.focus(); return; }
  stopMic();
  rec = new SR(); rec.lang="es-AR"; rec.continuous=true; rec.interimResults=true;
  const before = ta.value ? ta.value.replace(/\s*$/," ") : "";
  let finalText="";
  rec.onresult = ev=>{ let interim="";
    for(let i=ev.resultIndex;i<ev.results.length;i++){ const r=ev.results[i]; if(r.isFinal) finalText+=r[0].transcript; else interim+=r[0].transcript; }
    ta.value = before + finalText + interim; dictated.add(id); };
  rec.onerror = ev=>{ const blocked = ev.error==="not-allowed"||ev.error==="service-not-allowed"||ev.error==="audio-capture";
    hint(id, blocked ? "Esta pantalla no tiene permiso para usar el micrófono. "+KEYBOARD_TIP : "No se entendió el audio. Probá de nuevo.", true);
    if(blocked) ta.focus(); };
  rec.onend = ()=>{ btn.classList.remove("on"); btn.setAttribute("aria-label","Dictar por voz"); if(recBtn===btn){ recBtn=null; rec=null; } };
  try{ rec.start(); recBtn=btn; btn.classList.add("on"); btn.setAttribute("aria-label","Detener dictado"); hint(id,"Escuchando… hablá y tocá de nuevo el micrófono para terminar."); }
  catch{ hint(id, KEYBOARD_TIP); ta.focus(); }
}
function stopMic(){ if(rec){ try{rec.stop();}catch{} } }

/* ---------- arranque ---------- */
applyTono(ui.tono); resetTaskForm(); resetEvForm(); migrateReminders(); route(); init();
</script>
